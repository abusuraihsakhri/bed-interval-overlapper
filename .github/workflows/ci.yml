name: CI and Pages

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependency
        run: python -m pip install --upgrade pytest

      - name: Run Python tests
        run: python -m pytest -v

      - name: Verify CLI smoke test
        run: |
          python cli.py batch -i sample.csv -o out_smoke.csv
          test -s out_smoke.csv

      - name: Verify browser JavaScript syntax
        run: |
          node --check app.js
          node --check worker.js

  pages:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check Pages configuration
        id: pages-check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status="$(curl --silent --show-error --output pages.json --write-out '%{http_code}' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pages")"

          if [[ "${status}" == "200" ]]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          elif [[ "${status}" == "404" ]]; then
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "::warning title=GitHub Pages not enabled::Enable Pages with Source = GitHub Actions in repository Settings > Pages, then rerun this workflow."
          else
            cat pages.json
            echo "::error::Could not determine GitHub Pages configuration (HTTP ${status})."
            exit 1
          fi

      - uses: actions/checkout@v7
        if: steps.pages-check.outputs.enabled == 'true'

      - uses: actions/configure-pages@v6
        if: steps.pages-check.outputs.enabled == 'true'

      - uses: actions/upload-pages-artifact@v5
        if: steps.pages-check.outputs.enabled == 'true'
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.pages-check.outputs.enabled == 'true'
        uses: actions/deploy-pages@v5
